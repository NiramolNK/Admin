<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tab icon. There was no favicon link at all, which is why the tab showed
         the browser's default globe. .ico first for older browsers and the
         Windows taskbar; the PNGs are what Chrome actually picks. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2FB380" />

    <!-- PWA: lets phones/tablets "Add to Home Screen" and open NiRM full-screen
         like an app (no store needed). Manifest = name/icons/colours; the
         service worker (public/sw.js, registered in src/pwa.js) caches only the
         app shell — never Supabase data. apple-* tags are what iOS reads
         instead of the manifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NiRM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="NiRM" />

    <!-- Internal tool: keep it out of search indexes and model-training crawls.
         See public/robots.txt for the per-crawler list. Both are requests that
         only well-behaved crawlers honour — the real protection is that NiRM
         needs a login, and that Storage buckets are private. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />

    <!-- "NiRM Roster" truncated to "Roster" once a few tabs were open, which is
         the one word that does NOT identify the app. Name first. -->
    <title>NiRM</title>
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100vh; }
      body { font-family: 'DM Sans', sans-serif; background: #FAFBFC; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
